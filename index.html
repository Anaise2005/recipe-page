<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fluffy Pancakes Recipe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Pancakes</h1>

  <h2>Ingredients</h2>
  <ul>
    <li>1 cup flour</li>
    <li>1 cup milk</li>
    <li>1 egg</li>
    <li>1 tbsp sugar</li>
  </ul>

  <h2>Steps</h2>
  <ol>
    <li>Mix all the ingredients in a bowl.</li>
    <li>Heat a pan and pour in some batter.</li>
    <li>Flip when bubbles appear.</li>
    <li>Serve warm.</li>
  </ol>
</body>
</html>
